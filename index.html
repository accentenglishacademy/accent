<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Accent</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="accent-32.png">
<link rel="apple-touch-icon" href="accent-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Accent">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
  #carga { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #fff; transition: opacity .35s; z-index: 2; }
  #carga img { width: 96px; height: 96px; animation: lat 1.6s ease-in-out infinite; }
  #carga.fuera { opacity: 0; pointer-events: none; }
  @keyframes lat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }
  @media (prefers-reduced-motion: reduce) { #carga img { animation: none; } }
  #aviso { font: 16px/1.4 system-ui, sans-serif; padding: 24px; color: #333; }
</style>
</head>
<body>
<div id="carga"><img src="accent-192.png" alt="Accent"></div>
<script>
  /* ⇩⇩⇩ Pega aquí la dirección de la aplicación (la que acaba en /exec), entre las comillas ⇩⇩⇩ */
  var URL_APP = "https://script.google.com/macros/s/AKfycbwSVy9a11JUh5aFTv4PNQaa2w7a2TxpjStM4EzlBTtHv8SNwJUduHHjh1EmVwtqRoMuxw/exec";
  /* ⇧⇧⇧ Nada más hay que tocar en este archivo ⇧⇧⇧ */

  if (!/^https:\/\/script\.google\.com\/macros\/s\/[^"\s]+\/exec$/.test(URL_APP)) {
    document.getElementById("carga").innerHTML = '<p id="aviso">Falta poner la dirección de la aplicación en <b>index.html</b> (línea «URL_APP»).</p>';
  } else {
    var f = document.createElement("iframe");
    f.title = "Accent";
    f.allow = "clipboard-write; fullscreen";
    f.src = URL_APP;
    f.addEventListener("load", function () {
      setTimeout(function () { document.getElementById("carga").classList.add("fuera"); }, 250);
    });
    document.body.appendChild(f);
  }
</script>
</body>
</html>
